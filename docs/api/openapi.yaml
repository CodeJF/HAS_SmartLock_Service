        - $ref: '#/components/parameters/AccessTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeChangeRequest'
            example:
              home_id: '{{home_id}}'
              uuid: '{{uuid}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
