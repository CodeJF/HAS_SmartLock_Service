openapi: 3.0.3
info:
  title: HAS SmartLock Service API
  version: 0.1.0
  description: |
    当前仓库已实现接口的 OpenAPI 定义。
    用于导入 Apifox、Postman 等 API 测试平台。
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: System
  - name: User
  - name: Cloud
  - name: Device
  - name: Home
paths:
  /healthz:
    get:
      tags:
        - System
      summary: 健康检查
      operationId: healthCheck
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  status: ok
  /time:
    get:
      tags:
        - System
      summary: 获取服务器时间戳
      operationId: getServerTime
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  timestamp: 1711857600
  /getUrl:
    get:
      tags:
        - System
      summary: 获取服务器地址
      operationId: getServerURL
      parameters:
        - in: query
          name: username
          required: true
          schema:
            type: string
            example: '{{username}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetURLResponseEnvelope'
  /v1/user/registerSend:
    post:
      tags:
        - User
      summary: 发送注册验证码
      operationId: userRegisterSend
      description: |
        用户端常规签名接口。需携带 appid、app_version、phone_code、timestamp、request_id、sign 等 Header。
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
            example:
              username: '{{username}}'
              country: '{{country}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
              example:
                code: 1000
                msg: ok
                data: null
  /v1/user/loginSend:
    post:
      tags:
        - User
      summary: 发送登录验证码
      operationId: userLoginSend
      description: |
        用户端常规签名接口。需携带 appid、app_version、phone_code、timestamp、request_id、sign 等 Header。
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
            example:
              username: '{{username}}'
              country: '{{country}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
              example:
                code: 1000
                msg: ok
                data: null
  /v1/user/register:
    post:
      tags:
        - User
      summary: 用户注册
      operationId: userRegister
      description: |
        用户端常规签名接口。需携带 appid、app_version、phone_code、timestamp、request_id、sign 等 Header。
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: '{{username}}'
              country: '{{country}}'
              code: '{{code}}'
              password: '{{password}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  uid: u_123456789
                  access_token: access-token
                  refresh_token: refresh-token
                  is_debug: 0
                  expiration: 1711864800
  /v1/user/login:
    post:
      tags:
        - User
      summary: 用户登录
      operationId: userLogin
      description: |
        用户端常规签名接口。需携带 appid、app_version、phone_code、timestamp、request_id、sign 等 Header。
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              passwordLogin:
                summary: 密码登录
                value:
                  username: '{{username}}'
                  type: password
                  password: '{{password}}'
                  phone_brand: '{{phone_brand}}'
              codeLogin:
                summary: 验证码登录
                value:
                  username: '{{username}}'
                  type: code
                  code: '{{code}}'
                  phone_brand: '{{phone_brand}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenEnvelope'
  /v1/user/validateCode:
    post:
      tags:
        - User
      summary: 检查验证码
      operationId: userValidateCode
      description: |
        用户端常规签名接口。需携带 appid、app_version、phone_code、timestamp、request_id、sign 等 Header。
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateCodeRequest'
            example:
              username: '{{username}}'
              code: '{{code}}'
              type: register
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
              example:
                code: 1000
                msg: ok
                data: null
  /v1/user/resetSend:
    post:
      tags:
        - User
      summary: 发送忘记密码验证码
      operationId: userResetSend
      description: |
        用户端常规签名接口。需携带 appid、app_version、phone_code、timestamp、request_id、sign 等 Header。
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
            example:
              username: '{{username}}'
              country: '{{country}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
              example:
                code: 1000
                msg: ok
                data: null
  /v1/user/reset:
    post:
      tags:
        - User
      summary: 忘记密码（重置密码）
      operationId: userReset
      description: |
        用户端常规签名接口。需携带 appid、app_version、phone_code、timestamp、request_id、sign 等 Header。
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRequest'
            example:
              username: '{{username}}'
              code: '{{code}}'
              password: '{{new_password}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/user/refresh:
    post:
      tags:
        - User
      summary: 刷新 Token
      operationId: userRefresh
      description: |
        用户端常规签名接口。需携带 appid、app_version、phone_code、timestamp、request_id、sign 等 Header。
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: '{{refresh_token}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenEnvelope'
  /v1/user/info:
    get:
      tags:
        - User
      summary: 获取用户信息
      operationId: userInfo
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  username: demo@example.com
                  nickname: demo@example.com
                  avatar: avatar/u_123456789
                  is_debug: 0
                  register_time: 1711857600
  /v1/user/logout:
    post:
      tags:
        - User
      summary: 退出登录
      operationId: userLogout
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/user/updatePwd:
    post:
      tags:
        - User
      summary: 修改密码
      operationId: userUpdatePwd
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
            example:
              new_password: '{{new_password}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/user/updateInfo:
    post:
      tags:
        - User
      summary: 修改昵称
      operationId: userUpdateInfo
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInfoRequest'
            example:
              nickname: '{{nickname}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/user/putClient:
    post:
      tags:
        - User
      summary: 上报登录设备信息
      operationId: userPutClient
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutClientRequest'
            example:
              push_type: 1
              push_token: '{{push_token}}'
              brand: '{{brand}}'
              version: '{{version}}'
              language: '{{language}}'
              zone: '{{zone}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/cloud/getToken:
    get:
      tags:
        - Cloud
      summary: 获取 OSS STS 临时凭证
      operationId: cloudGetToken
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
        - in: query
          name: uuid
          required: true
          schema:
            type: string
            example: '{{uuid}}'
          description: 设备 UUID（当前仅兼容保留）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudTokenEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  access_token_id: STS.Ndemo
                  access_key_secret: demo-secret
                  security_token: demo-security-token
                  expiration: 1777777777
                  region_id: cn-shenzhen
                  endpoint: oss-cn-shenzhen.aliyuncs.com
                  bucket: has-smartlock
  /v1/device/homeCreate:
    post:
      tags:
        - Home
      summary: 创建家庭
      operationId: homeCreate
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeCreateRequest'
            example:
              name: '{{home_name}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/device/homes:
    get:
      tags:
        - Home
      summary: 家庭列表
      operationId: homes
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomesEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  - id: h_123456789
                    name: My Home
                    location: Shenzhen
                    count: 0
                    role: 1
                    create_time: 1711857600
  /v1/device/bind:
    post:
      tags:
        - Device
      summary: 设备绑定（仅限设备端调用）
      operationId: deviceBind
      description: |
        设备端专属签名接口。
        sign 使用 model_secret 计算，不使用用户端 secret_key 规则。
        计算方式为先做 HMAC-SHA256，再转十六进制字符串，最后对该字符串做 Base64。
        头串为 model + request_id + timestamp + uuid。
        参数串按旧项目客户端脚本兼容规则生成：Body 顶层字段排序后原值拼接，Query value 先做 encodeURIComponent。
      parameters:
        - $ref: '#/components/parameters/DeviceModelHeader'
        - $ref: '#/components/parameters/DeviceUUIDHeader'
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceBindRequest'
            example:
              uid: '{{uid}}'
              mac: '{{mac}}'
              zone: '{{zone}}'
              version: '{{firmware_version}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCredentialEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  username: '{{uuid}}'
                  password: '{{mqtt_password}}'
                  secret: '{{device_secret}}'
  /v1/device/login:
    post:
      tags:
        - Device
      summary: 设备登录（仅限设备端调用）
      operationId: deviceLogin
      description: |
        设备端专属签名接口。
        sign 使用 model_secret 计算，不使用用户端 secret_key 规则。
        计算方式为先做 HMAC-SHA256，再转十六进制字符串，最后对该字符串做 Base64。
        头串为 model + request_id + timestamp + uid + uuid。
        参数串按旧项目客户端脚本兼容规则生成：Body 顶层字段排序后原值拼接，Query value 先做 encodeURIComponent。
      parameters:
        - $ref: '#/components/parameters/DeviceModelHeader'
        - $ref: '#/components/parameters/DeviceUUIDHeader'
        - $ref: '#/components/parameters/DeviceUIDHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceLoginRequest'
            example:
              zone: '{{zone}}'
              version: '{{firmware_version}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCredentialEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  username: '{{uuid}}'
                  password: '{{mqtt_password}}'
                  secret: '{{device_secret}}'
  /v1/device/list:
    get:
      tags:
        - Device
      summary: 设备列表
      operationId: deviceList
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
        `State` 字段来自设备影子（shadow），当前返回 `desired` 与 `reported` 两部分实时状态。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
        - in: query
          name: home_id
          required: false
          schema:
            type: string
            example: '{{home_id}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListEnvelope'
              example:
                code: 1000
                msg: ok
                data: []
  /v1/device/newList:
    get:
      tags:
        - Device
      summary: 新设备列表
      operationId: newDeviceList
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewDevicesEnvelope'
              example:
                code: 1000
                msg: ok
                data: []
  /v1/device/models:
    get:
      tags:
        - Device
