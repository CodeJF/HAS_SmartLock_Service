            application/json:
              schema:
                $ref: '#/components/schemas/HomesEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  - id: h_123456789
                    name: My Home
                    location: Shenzhen
                    count: 0
                    role: 1
                    create_time: 1711857600
  /v1/device/bind:
    post:
      tags:
        - Device
      summary: 设备绑定（仅限设备端调用）
      operationId: deviceBind
      description: |
        设备端专属签名接口。
        sign 使用 model_secret 计算，不使用用户端 secret_key 规则。
      parameters:
        - $ref: '#/components/parameters/DeviceModelHeader'
        - $ref: '#/components/parameters/DeviceUUIDHeader'
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceBindRequest'
            example:
              uid: '{{uid}}'
              mac: '{{mac}}'
              zone: '{{zone}}'
              version: '{{firmware_version}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/device/login:
    post:
      tags:
        - Device
      summary: 设备登录（仅限设备端调用）
      operationId: deviceLogin
      description: |
        设备端专属签名接口。
