openapi: 3.0.3
info:
  title: HAS SmartLock Service API
  version: 0.1.0
  description: |
    当前仓库已实现接口的 OpenAPI 定义。
    用于导入 Apifox、Postman 等 API 测试平台。
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: System
  - name: User
  - name: Cloud
  - name: Home
paths:
  /healthz:
    get:
      tags:
        - System
      summary: 健康检查
      operationId: healthCheck
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  status: ok
  /time:
    get:
      tags:
        - System
      summary: 获取服务器时间戳
      operationId: getServerTime
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  timestamp: 1711857600
  /v1/user/registerSend:
    post:
      tags:
        - User
      summary: 发送注册验证码
      operationId: userRegisterSend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
            example:
              username: demo@example.com
              country: '86'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
              example:
                code: 1000
                msg: ok
                data: null
  /v1/user/loginSend:
    post:
      tags:
        - User
      summary: 发送登录验证码
      operationId: userLoginSend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
            example:
              username: demo@example.com
              country: '86'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
              example:
                code: 1000
                msg: ok
                data: null
  /v1/user/register:
    post:
      tags:
        - User
      summary: 用户注册
      operationId: userRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: demo@example.com
              country: '86'
              code: '123456'
              password: md5-password
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  uid: u_123456789
                  access_token: access-token
                  refresh_token: refresh-token
                  is_debug: 0
                  expiration: 1711864800
  /v1/user/login:
    post:
      tags:
        - User
      summary: 用户登录
      operationId: userLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              passwordLogin:
                summary: 密码登录
                value:
                  username: demo@example.com
                  type: password
                  password: md5-password
                  phone_brand: iPhone
              codeLogin:
                summary: 验证码登录
                value:
                  username: demo@example.com
                  type: code
                  code: '123456'
                  phone_brand: iPhone
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenEnvelope'
  /v1/user/validateCode:
    post:
      tags:
        - User
      summary: 检查验证码
      operationId: userValidateCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateCodeRequest'
            example:
              username: demo@example.com
              code: '123456'
              type: register
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/user/resetSend:
    post:
      tags:
        - User
      summary: 发送忘记密码验证码
      operationId: userResetSend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
            example:
              username: demo@example.com
              country: '86'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/user/reset:
    post:
      tags:
        - User
      summary: 忘记密码（重置密码）
      operationId: userReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRequest'
            example:
              username: demo@example.com
              code: '123456'
              password: new-md5-password
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/user/refresh:
    post:
      tags:
        - User
      summary: 刷新 Token
      operationId: userRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: refresh-token
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenEnvelope'
  /v1/user/info:
    get:
      tags:
        - User
      summary: 获取用户信息
      operationId: userInfo
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  username: demo@example.com
                  nickname: demo@example.com
                  avatar: avatar/u_123456789
                  is_debug: 0
                  register_time: 1711857600
  /v1/user/logout:
    post:
      tags:
        - User
      summary: 退出登录
      operationId: userLogout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/user/updatePwd:
    post:
      tags:
        - User
      summary: 修改密码
      operationId: userUpdatePwd
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
            example:
              new_password: new-md5-password
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/user/updateInfo:
    post:
      tags:
        - User
      summary: 修改昵称
      operationId: userUpdateInfo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInfoRequest'
            example:
              nickname: New Nickname
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/user/putClient:
    post:
      tags:
        - User
      summary: 上报登录设备信息
      operationId: userPutClient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutClientRequest'
            example:
              push_type: 1
              push_token: device-token
              brand: iPhone
              version: iOS 18
              language: zh_CN
              zone: Asia/Shanghai
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/cloud/getToken:
    get:
      tags:
        - Cloud
      summary: 获取 OSS STS 临时凭证
      operationId: cloudGetToken
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: uuid
          required: true
          schema:
            type: string
          description: 设备 UUID（当前仅兼容保留）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudTokenEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  access_token_id: STS.Ndemo
                  access_key_secret: demo-secret
                  security_token: demo-security-token
                  expiration: 1777777777
                  region_id: cn-shenzhen
                  endpoint: oss-cn-shenzhen.aliyuncs.com
                  bucket: has-smartlock
  /v1/device/homeCreate:
    post:
      tags:
        - Home
      summary: 创建家庭
      operationId: homeCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeCreateRequest'
            example:
              name: My Home
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/device/homes:
    get:
      tags:
        - Home
      summary: 家庭列表
      operationId: homes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomesEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  - id: h_123456789
                    name: My Home
                    location: Shenzhen
                    count: 0
                    role: 1
                    create_time: 1711857600
  /v1/device/homeDevices:
    get:
      tags:
        - Home
      summary: 家庭设备列表
      operationId: homeDevices
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: home_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeDevicesEnvelope'
              example:
                code: 1000
                msg: ok
                data: []
  /v1/device/homeUsers:
    get:
      tags:
        - Home
      summary: 家庭用户列表
      operationId: homeUsers
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: home_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeUsersEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  - uid: u_123456789
                    username: demo@example.com
                    avatar: avatar/u_123456789
                    role: 1
                    accept: 1
  /v1/device/homeUpdate:
    post:
      tags:
        - Home
      summary: 更新家庭信息
      operationId: homeUpdate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeUpdateRequest'
            example:
              home_id: h_123456789
              name: Updated Home
              location: Shenzhen
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/device/homeDelete:
    delete:
      tags:
        - Home
      summary: 删除家庭
      operationId: homeDelete
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: home_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/user/deleteSend:
    post:
      tags:
        - User
      summary: 发送删除帐号验证码
      operationId: userDeleteSend
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSendRequest'
            example:
              username: demo@example.com
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/user/delete:
    post:
      tags:
        - User
      summary: 删除帐号
      operationId: userDelete
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
            example:
              username: demo@example.com
              code: '123456'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EnvelopeBase:
      type: object
      required:
        - code
        - msg
      properties:
        code:
          type: integer
          example: 1000
        msg:
          type: string
          example: ok
    HealthData:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    HealthEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/HealthData'
    TimeData:
      type: object
      required:
        - timestamp
      properties:
        timestamp:
          type: integer
          format: int64
          example: 1711857600
    TimeEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TimeData'
    NullEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              nullable: true
    SendCodeRequest:
      type: object
      required:
        - username
        - country
      properties:
        username:
          type: string
          example: demo@example.com
        country:
          type: string
          example: '86'
    RegisterRequest:
      type: object
      required:
        - username
        - country
        - code
      properties:
        username:
          type: string
        country:
          type: string
        code:
          type: string
        password:
          type: string
          nullable: true
    LoginRequest:
      type: object
      required:
        - username
        - type
        - phone_brand
      properties:
        username:
          type: string
        type:
          type: string
          enum:
            - password
            - code
        password:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        phone_brand:
          type: string
      description: 当前实现支持密码登录和验证码登录，字段约束以后续主合同文档为准。
    ValidateCodeRequest:
      type: object
      required:
        - username
        - code
        - type
      properties:
        username:
          type: string
        code:
          type: string
        type:
          type: string
          enum:
            - login
            - register
            - reset
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    ResetRequest:
      type: object
      required:
        - username
        - code
        - password
      properties:
        username:
          type: string
        code:
          type: string
        password:
          type: string
    UpdatePasswordRequest:
      type: object
      required:
        - new_password
      properties:
        new_password:
          type: string
    UpdateInfoRequest:
      type: object
      required:
        - nickname
      properties:
        nickname:
          type: string
    PutClientRequest:
      type: object
      required:
        - push_type
        - push_token
      properties:
        push_type:
          type: integer
        push_token:
          type: string
        brand:
          type: string
        version:
          type: string
        language:
          type: string
        zone:
          type: string
    DeleteSendRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
    DeleteRequest:
      type: object
      required:
        - username
        - code
      properties:
        username:
          type: string
        code:
          type: string
    HomeCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    HomeUpdateRequest:
      type: object
      required:
        - home_id
        - name
        - location
      properties:
        home_id:
          type: string
        name:
          type: string
        location:
          type: string
    TokenData:
      type: object
      required:
        - uid
        - access_token
        - refresh_token
        - is_debug
        - expiration
      properties:
        uid:
          type: string
        access_token:
          type: string
        refresh_token:
          type: string
        is_debug:
          type: integer
        expiration:
          type: integer
          format: int64
    TokenEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TokenData'
    UserInfoData:
      type: object
      required:
        - username
        - nickname
        - avatar
        - is_debug
        - register_time
      properties:
        username:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        is_debug:
          type: integer
        register_time:
          type: integer
          format: int64
    UserInfoEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserInfoData'
    CloudTokenData:
      type: object
      required:
        - access_token_id
        - access_key_secret
        - security_token
        - expiration
        - region_id
        - endpoint
        - bucket
      properties:
        access_token_id:
          type: string
        access_key_secret:
          type: string
        security_token:
          type: string
        expiration:
          type: integer
          format: int64
        region_id:
          type: string
        endpoint:
          type: string
        bucket:
          type: string
    CloudTokenEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CloudTokenData'
    HomeItem:
      type: object
      required:
        - id
        - name
        - location
        - count
        - role
        - create_time
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: string
        count:
          type: integer
        role:
          type: integer
        create_time:
          type: integer
          format: int64
    HomeUser:
      type: object
      required:
        - uid
        - username
        - avatar
        - role
        - accept
      properties:
        uid:
          type: string
        username:
          type: string
        avatar:
          type: string
        role:
          type: integer
        accept:
          type: integer
    DeviceState:
      type: object
      properties:
        desired:
          type: object
          additionalProperties: true
        reported:
          type: object
          additionalProperties: true
    Device:
      type: object
      required:
        - id
        - uuid
        - device_id
        - uid
        - bind_type
        - secret
        - name
        - first_bind_time
        - bind_time
        - State
      properties:
        id:
          type: integer
        uuid:
          type: string
        device_id:
          type: string
        uid:
          type: string
        bind_type:
          type: integer
        secret:
          type: string
        name:
          type: string
        first_bind_time:
          type: integer
          format: int64
        bind_time:
          type: integer
          format: int64
        State:
          $ref: '#/components/schemas/DeviceState'
    HomesEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/HomeItem'
    HomeDevicesEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Device'
    HomeUsersEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/HomeUser'
