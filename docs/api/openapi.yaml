        - is_debug
        - register_time
      properties:
        username:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        is_debug:
          type: integer
        register_time:
          type: integer
          format: int64
    UserInfoEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserInfoData'
    CloudTokenData:
      type: object
      required:
        - access_token_id
