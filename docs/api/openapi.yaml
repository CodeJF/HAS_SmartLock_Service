        `uuid` 与 `home_id` 同时传入时按交集过滤；`start_time` 采用独占上界语义，即 `event.time < start_time`。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
        - in: query
          name: date
          required: false
          schema:
            type: string
            example: '2026-04-11'
        - in: query
          name: uuid
          required: false
          schema:
            type: string
            example: '{{uuid}}'
        - in: query
          name: home_id
          required: false
          schema:
            type: string
            example: '{{home_id}}'
        - in: query
          name: type
          required: false
          schema:
            type: string
            example: '1,2'
        - in: query
          name: start_time
          required: false
          schema:
            type: integer
            format: int64
            example: 1770000000
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListEnvelope'
  /v1/event/existDay:
    get:
      tags:
        - Event
      summary: 按月查询有事件的日期
      operationId: eventExistDay
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
        第一版仅纳入设备 owner 与当前家庭成员的事件可见性，不包含设备分享成员。
        `uuid` 与 `home_id` 同时传入时按交集过滤。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
        - in: query
          name: month
          required: true
          schema:
            type: string
            example: '2026-04'
        - in: query
          name: uuid
          required: false
          schema:
            type: string
            example: '{{uuid}}'
        - in: query
          name: home_id
          required: false
          schema:
            type: string
            example: '{{home_id}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventExistDayEnvelope'
  /v1/event/unreadNum:
    get:
      tags:
        - Event
      summary: 未读事件数量
      operationId: eventUnreadNum
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
        仅统计当前登录用户在该设备下可见、且尚未标记已读/删除的事件数。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
        - in: query
          name: uuid
          required: true
          schema:
            type: string
            example: '{{uuid}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadNumEnvelope'
  /v1/event/read:
    post:
      tags:
        - Event
      summary: 标记事件已读
      operationId: eventRead
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
        `msg_id` 必须直接取自 `GET /v1/event/list` 返回项里的 `id`，且已读只影响当前用户自己的事件盒视角。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventReadRequest'
            example:
              msg_id: '{{event_id}}'
              uuid: '{{uuid}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/event/delete:
    delete:
      tags:
        - Event
      summary: 删除事件
      operationId: eventDelete
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
        删除只影响当前用户视角，不会删除底层事件记录。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
        - in: query
          name: msg_id
          required: true
          schema:
            type: string
            example: '{{event_id}}'
        - in: query
          name: uuid
          required: false
          schema:
            type: string
            example: '{{uuid}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/message/list:
    get:
      tags:
        - Message
      summary: 消息列表
      operationId: messageList
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
        第一版返回 `type=1` 家庭分享邀请、`type=2` 家庭分享结果、`type=3` 家庭移除通知、`type=4` 设备分享邀请、`type=5` 设备分享结果。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
        - in: query
          name: start_id
          required: false
          schema:
            type: string
            example: '{{message_id}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListEnvelope'
  /v1/message/unreadNum:
    get:
      tags:
        - Message
      summary: 未读消息数量
      operationId: messageUnreadNum
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
        第一版统计 `type=1`、`type=2`、`type=3`、`type=4`、`type=5` 五类消息的未读数。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadNumEnvelope'
  /v1/message/read:
    post:
      tags:
        - Message
      summary: 标记消息已读
      operationId: messageRead
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
        `message_id` 不传时，标记当前用户全部消息已读。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageReadRequest'
            example:
              message_id: '{{message_id}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/message/delete:
    delete:
      tags:
        - Message
      summary: 删除消息
      operationId: messageDelete
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
        当前只支持删除单条消息，且只允许删除当前登录用户自己消息盒中的消息。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
        - in: query
          name: message_id
          required: true
          schema:
            type: string
            example: '{{message_id}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
components:
  parameters:
    AppIDHeader:
      in: header
      name: appid
      required: true
      example: '{{appid}}'
      schema:
        type: string
        default: '{{appid}}'
      description: 应用 ID
    AppVersionHeader:
      in: header
      name: app_version
      required: true
      example: '{{app_version}}'
      schema:
        type: string
        default: '{{app_version}}'
      description: 应用版本号
    PhoneCodeHeader:
      in: header
      name: phone_code
      required: true
      example: '{{phone_code}}'
      schema:
        type: string
        default: '{{phone_code}}'
      description: 手机国家区号
    TimestampHeader:
      in: header
      name: timestamp
      required: true
      example: '{{timestamp}}'
      schema:
        type: string
        default: '{{timestamp}}'
      description: Unix 秒级时间戳
    RequestIDHeader:
      in: header
      name: request_id
      required: true
      example: '{{request_id}}'
      schema:
        type: string
        default: '{{request_id}}'
      description: 请求唯一 ID
    SignHeader:
      in: header
      name: sign
      required: true
      example: '{{sign}}'
      schema:
        type: string
        default: '{{sign}}'
      description: 请求签名
    AccessTokenHeader:
      in: header
      name: access_token
      required: true
      example: '{{access_token}}'
      schema:
        type: string
        default: '{{access_token}}'
      description: 访问令牌
    DeviceModelHeader:
      in: header
      name: model
      required: true
      example: '{{model}}'
      schema:
        type: string
        default: '{{model}}'
      description: 设备型号
    DeviceUUIDHeader:
      in: header
      name: uuid
      required: true
      example: '{{uuid}}'
      schema:
        type: string
        default: '{{uuid}}'
      description: 设备 UUID
    DeviceUIDHeader:
      in: header
      name: uid
      required: true
      example: '{{uid}}'
      schema:
        type: string
        default: '{{uid}}'
      description: 用户 UID
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EnvelopeBase:
      type: object
      required:
        - code
        - msg
      properties:
        code:
          type: integer
          example: 1000
        msg:
          type: string
          example: ok
    HealthData:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    HealthEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/HealthData'
    TimeData:
      type: object
      required:
        - timestamp
      properties:
        timestamp:
          type: integer
          format: int64
          example: 1711857600
    TimeEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TimeData'
    GetURLResponse:
      type: object
      required:
        - exist
        - url
      properties:
        exist:
          type: boolean
        url:
          type: object
          required:
            - api
            - mqtt
            - websocket
          properties:
            api:
              type: string
            mqtt:
              type: string
            websocket:
              type: string
    GetURLResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GetURLResponse'
    NullEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              nullable: true
    SendCodeRequest:
      type: object
      required:
        - username
        - country
      properties:
        username:
          type: string
          example: '{{username}}'
        country:
          type: string
          example: '{{country}}'
    RegisterRequest:
      type: object
      required:
        - username
        - country
        - code
      properties:
        username:
          type: string
        country:
          type: string
        code:
          type: string
        password:
          type: string
          nullable: true
    LoginRequest:
      type: object
      required:
        - username
        - type
        - phone_brand
      properties:
        username:
          type: string
        type:
          type: string
          enum:
            - password
            - code
        password:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        phone_brand:
          type: string
      description: 当前实现支持密码登录和验证码登录，字段约束以后续主合同文档为准。
    ValidateCodeRequest:
      type: object
      required:
        - username
        - code
        - type
      properties:
        username:
          type: string
        code:
          type: string
        type:
          type: string
          enum:
            - login
            - register
            - reset
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    ResetRequest:
      type: object
      required:
        - username
        - code
        - password
      properties:
        username:
          type: string
        code:
          type: string
        password:
          type: string
    UpdatePasswordRequest:
      type: object
      required:
        - new_password
      properties:
        new_password:
          type: string
    UpdateInfoRequest:
      type: object
      required:
        - nickname
      properties:
        nickname:
          type: string
    PutClientRequest:
      type: object
      required:
        - push_type
        - push_token
      properties:
        push_type:
          type: integer
        push_token:
          type: string
        brand:
          type: string
        version:
          type: string
        language:
          type: string
        zone:
          type: string
    DeleteSendRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
    DeleteRequest:
      type: object
      required:
        - username
        - code
      properties:
        username:
          type: string
        code:
          type: string
    HomeCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    HomeUpdateRequest:
      type: object
      required:
        - home_id
        - name
        - location
      properties:
        home_id:
          type: string
        name:
          type: string
        location:
          type: string
    HomeAddDeviceRequest:
      type: object
      required:
        - home_id
        - uuid
      properties:
        home_id:
          type: string
        uuid:
          type: string
    HomeChangeRequest:
      type: object
      required:
        - home_id
        - uuid
      properties:
        home_id:
          type: string
        uuid:
          type: string
    HomeShareRequest:
      type: object
      required:
        - home_id
        - username
      properties:
        home_id:
          type: string
        username:
          type: string
    HomeShareFeedbackRequest:
