      properties:
        access_token_id:
          type: string
        access_key_secret:
          type: string
        security_token:
          type: string
        expiration:
          type: integer
          format: int64
        region_id:
          type: string
        endpoint:
          type: string
        bucket:
          type: string
    CloudTokenEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CloudTokenData'
    HomeItem:
      type: object
      required:
        - id
        - name
        - location
        - count
        - role
        - create_time
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: string
        count:
          type: integer
        role:
          type: integer
        create_time:
          type: integer
          format: int64
    HomeUser:
      type: object
      required:
        - uid
        - username
        - avatar
        - role
        - accept
      properties:
        uid:
          type: string
        username:
          type: string
        avatar:
          type: string
        role:
          type: integer
        accept:
          type: integer
    DeviceState:
      type: object
      properties:
        desired:
          type: object
          additionalProperties: true
        reported:
          type: object
          additionalProperties: true
    Device:
      type: object
      required:
        - id
