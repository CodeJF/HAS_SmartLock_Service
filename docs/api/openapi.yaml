        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeAddDeviceRequest'
            example:
              home_id: '{{home_id}}'
              uuid: '{{uuid}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/device/homeChange:
