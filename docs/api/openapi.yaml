openapi: 3.0.3
info:
  title: HAS SmartLock Service API
  version: 0.1.0
  description: |
    当前仓库已实现接口的 OpenAPI 定义。
    用于导入 Apifox、Postman 等 API 测试平台。
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: System
  - name: User
  - name: Cloud
  - name: Device
  - name: Home
paths:
  /healthz:
    get:
      tags:
        - System
      summary: 健康检查
      operationId: healthCheck
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  status: ok
  /time:
    get:
      tags:
        - System
      summary: 获取服务器时间戳
      operationId: getServerTime
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  timestamp: 1711857600
  /v1/user/registerSend:
    post:
      tags:
        - User
      summary: 发送注册验证码
      operationId: userRegisterSend
      description: |
        用户端常规签名接口。需携带 appid、app_version、phone_code、timestamp、request_id、sign 等 Header。
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
            example:
              username: '{{username}}'
              country: '{{country}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
              example:
                code: 1000
                msg: ok
                data: null
  /v1/user/loginSend:
    post:
      tags:
        - User
      summary: 发送登录验证码
      operationId: userLoginSend
      description: |
        用户端常规签名接口。需携带 appid、app_version、phone_code、timestamp、request_id、sign 等 Header。
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
            example:
              username: '{{username}}'
              country: '{{country}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
              example:
                code: 1000
                msg: ok
                data: null
  /v1/user/register:
    post:
      tags:
        - User
      summary: 用户注册
      operationId: userRegister
      description: |
        用户端常规签名接口。需携带 appid、app_version、phone_code、timestamp、request_id、sign 等 Header。
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: '{{username}}'
              country: '{{country}}'
              code: '{{code}}'
              password: '{{password}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  uid: u_123456789
                  access_token: access-token
                  refresh_token: refresh-token
                  is_debug: 0
                  expiration: 1711864800
  /v1/user/login:
    post:
      tags:
        - User
      summary: 用户登录
      operationId: userLogin
      description: |
        用户端常规签名接口。需携带 appid、app_version、phone_code、timestamp、request_id、sign 等 Header。
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              passwordLogin:
                summary: 密码登录
                value:
                  username: '{{username}}'
                  type: password
                  password: '{{password}}'
                  phone_brand: '{{phone_brand}}'
              codeLogin:
                summary: 验证码登录
                value:
                  username: '{{username}}'
                  type: code
                  code: '{{code}}'
                  phone_brand: '{{phone_brand}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenEnvelope'
  /v1/user/validateCode:
    post:
      tags:
        - User
      summary: 检查验证码
      operationId: userValidateCode
      description: |
        用户端常规签名接口。需携带 appid、app_version、phone_code、timestamp、request_id、sign 等 Header。
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateCodeRequest'
            example:
              username: '{{username}}'
              code: '{{code}}'
              type: register
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/user/resetSend:
    post:
      tags:
        - User
      summary: 发送忘记密码验证码
      operationId: userResetSend
      description: |
        用户端常规签名接口。需携带 appid、app_version、phone_code、timestamp、request_id、sign 等 Header。
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
            example:
              username: '{{username}}'
              country: '{{country}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/user/reset:
    post:
      tags:
        - User
      summary: 忘记密码（重置密码）
      operationId: userReset
      description: |
        用户端常规签名接口。需携带 appid、app_version、phone_code、timestamp、request_id、sign 等 Header。
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRequest'
            example:
              username: '{{username}}'
              code: '{{code}}'
              password: '{{new_password}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/user/refresh:
    post:
      tags:
        - User
      summary: 刷新 Token
      operationId: userRefresh
      description: |
        用户端常规签名接口。需携带 appid、app_version、phone_code、timestamp、request_id、sign 等 Header。
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: '{{refresh_token}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenEnvelope'
  /v1/user/info:
    get:
      tags:
        - User
      summary: 获取用户信息
      operationId: userInfo
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  username: demo@example.com
                  nickname: demo@example.com
                  avatar: avatar/u_123456789
                  is_debug: 0
                  register_time: 1711857600
  /v1/user/logout:
    post:
      tags:
        - User
      summary: 退出登录
