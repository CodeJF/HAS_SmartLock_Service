    HomeShareRemoveRequest:
      type: object
      required:
        - home_id
        - uid
      properties:
        home_id:
          type: string
        uid:
          type: string
    EventReadRequest:
      type: object
      required:
        - msg_id
        - uuid
      properties:
        msg_id:
          type: string
        uuid:
          type: string
    DeviceUpgradeQuery:
      type: object
      required:
        - uuid
        - flag
      properties:
        uuid:
          type: string
        flag:
          type: string
    DeviceShareRequest:
      type: object
      required:
        - username
        - uuid
      properties:
        username:
          type: string
        uuid:
          type: string
    DeviceShareFeedbackRequest:
      type: object
      required:
        - msg_id
        - status
      properties:
        msg_id:
          type: string
        status:
          type: integer
          enum:
            - 1
            - 2
    MessageReadRequest:
      type: object
      properties:
        message_id:
          type: string
    UpNameRequest:
      type: object
      required:
        - uuid
        - name
      properties:
        uuid:
