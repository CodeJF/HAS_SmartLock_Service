        id:
          type: integer
        uuid:
          type: string
        device_id:
          type: string
        uid:
          type: string
        bind_type:
          type: integer
        secret:
          type: string
        name:
          type: string
        first_bind_time:
          type: integer
          format: int64
        bind_time:
          type: integer
          format: int64
        State:
          $ref: '#/components/schemas/DeviceState'
    NewDevice:
      type: object
      required:
        - uuid
        - device_id
        - uid
        - bind_type
        - secret
        - name
        - bind_status
        - first_bind_time
        - bind_time
        - delete_time
      properties:
        uuid:
          type: string
        device_id:
          type: string
        uid:
          type: string
        bind_type:
          type: integer
        secret:
          type: string
        name:
          type: string
        bind_status:
          type: integer
