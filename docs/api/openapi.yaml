      operationId: homeChange
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
        第一版仅支持本人设备切换家庭；当前用户必须能看到设备当前所在家庭，且必须是目标家庭 owner；目标家庭等于当前家庭时按成功处理；设备未挂家庭时返回失败。
      security:
