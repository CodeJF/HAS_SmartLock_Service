      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/user/putClient:
    post:
      tags:
        - User
      summary: 上报登录设备信息
      operationId: userPutClient
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutClientRequest'
            example:
              push_type: 1
              push_token: '{{push_token}}'
              brand: '{{brand}}'
              version: '{{version}}'
              language: '{{language}}'
              zone: '{{zone}}'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
  /v1/cloud/getToken:
    get:
      tags:
        - Cloud
      summary: 获取 OSS STS 临时凭证
      operationId: cloudGetToken
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
        - in: query
          name: uuid
          required: true
          schema:
            type: string
            example: '{{uuid}}'
          description: 设备 UUID（当前仅兼容保留）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudTokenEnvelope'
              example:
                code: 1000
                msg: ok
                data:
                  access_token_id: STS.Ndemo
                  access_key_secret: demo-secret
                  security_token: demo-security-token
                  expiration: 1777777777
                  region_id: cn-shenzhen
                  endpoint: oss-cn-shenzhen.aliyuncs.com
                  bucket: has-smartlock
  /v1/device/homeCreate:
    post:
      tags:
        - Home
      summary: 创建家庭
      operationId: homeCreate
