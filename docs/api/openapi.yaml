    delete:
      tags:
        - Device
      summary: 移除设备
      operationId: deviceRemove
      description: |
        用户端常规签名接口。除签名头外，Auth 为必需，因此还需要 access_token Header。
        当前接口承载设备解绑语义：先向设备下发 `func/UnBind`，再清理后端绑定关系与 MQTT 凭证/ACL/缓存。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppIDHeader'
        - $ref: '#/components/parameters/AppVersionHeader'
        - $ref: '#/components/parameters/PhoneCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/RequestIDHeader'
        - $ref: '#/components/parameters/SignHeader'
        - $ref: '#/components/parameters/AccessTokenHeader'
        - in: query
          name: uuid
          required: true
          schema:
            type: string
            example: '{{uuid}}'
        - in: query
          name: clean_data
          required: false
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullEnvelope'
      x-realtime-websocket:
        path: /ws
        handshakeHeaders:
          - access_token
          - phone_code
        requestFields:
          - msg_id
          - method
          - uuid
          - time
          - version
          - data
        immediateMethods:
          - SetAttribute
          - GetAttribute
          - SetNotifyStatus
          - GetNotifyStatus
          - SleepState
          - Awake
          - Lock
          - Unlock
          - SetBluetoothSwitch
          - DelBluetoothSwitch
          - OtaUpgrade
          - Reboot
          - ResetSetting
          - Call
          - OthersAnswer
        delayedMethods:
          - CreateUser
          - UpdateUser
          - DelUser
          - AddPwd
          - UpdatePwd
          - DelPwd
          - SetBackgroundImage
          - ChangeCam
        stubMethods:
          - LeaveWord
          - WebrtcSignal
          - SetP2pState
          - QuickReplyFile
        pushMethods:
          - DeviceBind
          - DeviceUnBind
          - DevicesChanged
          - AttributeChange
          - Ring
          - RingStop
          - ServerFunc.<funcName>
