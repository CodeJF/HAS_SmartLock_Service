components:
  parameters:
    AppIDHeader:
      in: header
      name: appid
      required: true
      example: '{{appid}}'
      schema:
        type: string
        default: '{{appid}}'
      description: 应用 ID
    AppVersionHeader:
      in: header
      name: app_version
      required: true
      example: '{{app_version}}'
      schema:
        type: string
        default: '{{app_version}}'
      description: 应用版本号
    PhoneCodeHeader:
      in: header
      name: phone_code
      required: true
      example: '{{phone_code}}'
      schema:
        type: string
        default: '{{phone_code}}'
      description: 手机国家区号
    TimestampHeader:
      in: header
      name: timestamp
      required: true
      example: '{{timestamp}}'
      schema:
        type: string
        default: '{{timestamp}}'
      description: Unix 秒级时间戳
    RequestIDHeader:
      in: header
      name: request_id
      required: true
      example: '{{request_id}}'
      schema:
        type: string
        default: '{{request_id}}'
      description: 请求唯一 ID
    SignHeader:
      in: header
      name: sign
      required: true
      example: '{{sign}}'
      schema:
        type: string
        default: '{{sign}}'
      description: 请求签名
    AccessTokenHeader:
      in: header
      name: access_token
      required: true
      example: '{{access_token}}'
      schema:
        type: string
        default: '{{access_token}}'
      description: 访问令牌
    DeviceModelHeader:
      in: header
      name: model
      required: true
      example: '{{model}}'
      schema:
        type: string
        default: '{{model}}'
      description: 设备型号
    DeviceUUIDHeader:
      in: header
      name: uuid
      required: true
      example: '{{uuid}}'
      schema:
        type: string
        default: '{{uuid}}'
      description: 设备 UUID
    DeviceUIDHeader:
      in: header
      name: uid
      required: true
      example: '{{uid}}'
      schema:
        type: string
        default: '{{uid}}'
      description: 用户 UID
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EnvelopeBase:
      type: object
      required:
        - code
        - msg
      properties:
        code:
          type: integer
          example: 1000
        msg:
          type: string
          example: ok
    HealthData:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    HealthEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/HealthData'
    TimeData:
      type: object
      required:
        - timestamp
      properties:
        timestamp:
          type: integer
          format: int64
          example: 1711857600
    TimeEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TimeData'
    NullEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              nullable: true
    SendCodeRequest:
      type: object
      required:
        - username
        - country
      properties:
        username:
          type: string
          example: '{{username}}'
        country:
          type: string
          example: '{{country}}'
    RegisterRequest:
      type: object
      required:
        - username
        - country
        - code
      properties:
        username:
          type: string
        country:
          type: string
        code:
          type: string
        password:
          type: string
          nullable: true
    LoginRequest:
      type: object
      required:
        - username
        - type
        - phone_brand
      properties:
        username:
          type: string
        type:
          type: string
          enum:
            - password
            - code
        password:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        phone_brand:
          type: string
      description: 当前实现支持密码登录和验证码登录，字段约束以后续主合同文档为准。
    ValidateCodeRequest:
      type: object
      required:
        - username
        - code
        - type
      properties:
        username:
          type: string
        code:
          type: string
        type:
          type: string
          enum:
            - login
            - register
            - reset
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    ResetRequest:
      type: object
      required:
        - username
        - code
        - password
      properties:
        username:
          type: string
        code:
          type: string
        password:
          type: string
    UpdatePasswordRequest:
      type: object
      required:
        - new_password
      properties:
        new_password:
          type: string
    UpdateInfoRequest:
      type: object
      required:
        - nickname
      properties:
        nickname:
          type: string
    PutClientRequest:
      type: object
      required:
        - push_type
        - push_token
      properties:
        push_type:
          type: integer
        push_token:
          type: string
        brand:
          type: string
        version:
          type: string
        language:
          type: string
        zone:
          type: string
    DeleteSendRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
    DeleteRequest:
      type: object
      required:
        - username
        - code
      properties:
        username:
          type: string
        code:
          type: string
    HomeCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    HomeUpdateRequest:
      type: object
      required:
        - home_id
        - name
        - location
      properties:
        home_id:
          type: string
        name:
          type: string
        location:
          type: string
    HomeAddDeviceRequest:
      type: object
      required:
        - home_id
        - uuid
      properties:
        home_id:
          type: string
        uuid:
          type: string
    HomeChangeRequest:
      type: object
      required:
        - home_id
        - uuid
      properties:
        home_id:
          type: string
        uuid:
          type: string
    UpNameRequest:
      type: object
      required:
        - uuid
        - name
      properties:
        uuid:
          type: string
        name:
          type: string
    DeviceBindRequest:
      type: object
      required:
        - uid
        - mac
        - zone
        - version
      properties:
        uid:
          type: string
        mac:
          type: string
        zone:
          type: string
        version:
          type: string
    DeviceLoginRequest:
      type: object
      required:
        - zone
        - version
      properties:
        zone:
          type: string
        version:
          type: string
    TokenData:
      type: object
      required:
        - uid
        - access_token
        - refresh_token
        - is_debug
        - expiration
      properties:
        uid:
          type: string
        access_token:
          type: string
        refresh_token:
          type: string
        is_debug:
          type: integer
        expiration:
          type: integer
          format: int64
    TokenEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TokenData'
    UserInfoData:
      type: object
      required:
        - username
        - nickname
        - avatar
        - is_debug
        - register_time
      properties:
        username:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        is_debug:
          type: integer
        register_time:
          type: integer
          format: int64
    UserInfoEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserInfoData'
    CloudTokenData:
      type: object
      required:
        - access_token_id
        - access_key_secret
        - security_token
        - expiration
        - region_id
        - endpoint
        - bucket
      properties:
        access_token_id:
          type: string
        access_key_secret:
          type: string
        security_token:
          type: string
        expiration:
          type: integer
          format: int64
        region_id:
          type: string
        endpoint:
          type: string
        bucket:
          type: string
    CloudTokenEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CloudTokenData'
    HomeItem:
      type: object
      required:
        - id
        - name
        - location
        - count
        - role
        - create_time
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: string
        count:
          type: integer
        role:
          type: integer
        create_time:
          type: integer
          format: int64
    HomeUser:
      type: object
      required:
        - uid
        - username
        - avatar
        - role
        - accept
      properties:
        uid:
          type: string
        username:
          type: string
        avatar:
          type: string
        role:
          type: integer
        accept:
          type: integer
    DeviceState:
      type: object
      properties:
        desired:
          type: object
          additionalProperties: true
        reported:
          type: object
          additionalProperties: true
    Device:
      type: object
      required:
        - id
        - uuid
        - device_id
        - uid
        - bind_type
        - secret
        - name
        - first_bind_time
        - bind_time
        - State
      properties:
        id:
          type: integer
        uuid:
          type: string
        device_id:
          type: string
        uid:
          type: string
        bind_type:
          type: integer
        secret:
          type: string
        name:
          type: string
        first_bind_time:
          type: integer
          format: int64
        bind_time:
          type: integer
          format: int64
        State:
          $ref: '#/components/schemas/DeviceState'
    NewDevice:
      type: object
      required:
        - uuid
        - device_id
        - uid
        - bind_type
        - secret
        - name
        - bind_status
        - first_bind_time
        - bind_time
        - delete_time
      properties:
        uuid:
          type: string
        device_id:
          type: string
        uid:
          type: string
        bind_type:
          type: integer
        secret:
          type: string
        name:
          type: string
        bind_status:
          type: integer
        first_bind_time:
          type: integer
          format: int64
        bind_time:
          type: integer
          format: int64
        delete_time:
          type: integer
          format: int64
    HomesEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/HomeItem'
    DeviceListEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Device'
    HomeDevicesEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Device'
    NewDevicesEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/NewDevice'
    HomeUsersEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/HomeUser'
